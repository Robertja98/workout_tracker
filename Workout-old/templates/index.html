
<?php
error_reporting(E_ALL);
ini_set('display_errors', 1);

require_once "utils.php";

// Configuration
$dataFolder = __DIR__ . "/data";
$csvFile = $dataFolder . "/workouts.csv";
$routinesFile = $dataFolder . "/routines.json";
$headers = ["date", "workout_type", "exercise", "sets", "reps", "weight", "duration", "notes"];

// Initialize CSV
initialize_csv($csvFile, $headers);

// Routing
$uri = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
$method = $_SERVER['REQUEST_METHOD'];

// Dashboard route
if ($uri === "/dashboard") {
    include "dashboard.php";
    exit;
}

// Home page route
if ($uri === "/") {
    $workouts = read_workouts($csvFile);

    // Handle form submission
    if ($method === "POST" && isset($_POST['exercise'])) {
        $newWorkout = [
            date("Y-m-d"),
            $_POST['workout_type'],
            $_POST['exercise'],
            $_POST['sets'],
            $_POST['reps'],
            $_POST['weight'],
            $_POST['duration'],
            $_POST['notes']
        ];
        add_workout($csvFile, $headers, $newWorkout);
        header("Location: /");
        exit;
    }
?>
